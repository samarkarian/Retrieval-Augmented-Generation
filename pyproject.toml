[project]
name = "RAG"
version = "0.1.0"
description = "Build a Retrieval-Augmented Generation system that answers questions about a codebase"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fire>=0.7.1",
    "flake8==7.3.0",
    "mypy==1.19.1",
    "pydantic==2.13.4",
    "rank-bm25>=0.2.2",
    "torch>=2.13.0",
    "tqdm>=4.70.0",
    "transformers>=5.15.0",
]

[tool.mypy]
exclude = ['^data/', '^\.venv/', '^moulinette/']
